# Gradle
# Jellyfin-TV-Client: mehr Speicher – das App-Bundle mit libass und FFmpeg brauchte beim Packen mehr als 2 GB
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Android
android.useAndroidX=true

# Enable LeakCanary
leakcanary.enable=false
