# Jellyfin-TV-Client: baut die App bei jedem Push auf main und bei jedem Tag v*.
# Bei einem Tag (z. B. v1.0.0) wird zusätzlich ein GitHub-Release mit der APK angelegt.
# Für eine signierte App müssen die Secrets KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS und
# KEY_PASSWORD gesetzt sein (siehe README). Ohne sie entsteht nur eine Debug-APK.
name: TV-Client / Build

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release mit der Version aus tv-client-version.txt anlegen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set JELLYFIN_VERSION
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "JELLYFIN_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "JELLYFIN_VERSION=$(tr -d '[:space:]' < tv-client-version.txt)" >> $GITHUB_ENV
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Keine Signatur-Secrets gesetzt – es wird nur eine Debug-APK gebaut (siehe README)."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Assemble release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Assemble debug APK
        if: steps.keystore.outputs.signed != 'true'
        run: ./gradlew :app:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p build/tv-client
          find app/build/outputs/apk -iname "*.apk" -exec cp "{}" build/tv-client/ \;
          find app/build/outputs/bundle -iname "*.aab" -exec cp "{}" build/tv-client/ \; 2>/dev/null || true
          # Fester Dateiname für einen gleichbleibenden Download-Link:
          # https://github.com/DrdotHouse2106/Jellyfin-TV-Client/releases/latest/download/quallenkino.apk
          for f in build/tv-client/*-release.apk; do [ -e "$f" ] && cp "$f" build/tv-client/quallenkino.apk; done

      # webOS (LG) in derselben Version im selben Release:
      # https://github.com/DrdotHouse2106/Jellyfin-TV-Client/releases/latest/download/quallenkino-webos.ipk
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Build webOS package
        working-directory: webos
        run: |
          npm install -g @webosose/ares-cli
          node -e "const f='frontend/appinfo.json',fs=require('fs'),a=JSON.parse(fs.readFileSync(f));a.version=process.env.JELLYFIN_VERSION;fs.writeFileSync(f,JSON.stringify(a,null,4)+'\\n')"
          ares-package --check services frontend
          mkdir -p build
          ares-package --no-minify --outdir build/ services frontend
          cp "build/de.drdothouse.quallenkino_${JELLYFIN_VERSION}_all.ipk" "../build/tv-client/quallenkino-webos-v${JELLYFIN_VERSION}.ipk"
          cp "build/de.drdothouse.quallenkino_${JELLYFIN_VERSION}_all.ipk" ../build/tv-client/quallenkino-webos.ipk
          ls -la ../build/tv-client

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: jellyfin-tv-client-${{ env.JELLYFIN_VERSION }}
          retention-days: 30
          if-no-files-found: error
          path: build/tv-client/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$JELLYFIN_VERSION"
          gh release create "$TAG" build/tv-client/* --target "$GITHUB_SHA" --title "Quallenkino $TAG" --notes "Fire TV / Android TV: quallenkino.apk – LG webOS: quallenkino-webos.ipk. Änderungen siehe CHANGELOG-TV.md." \
            || gh release upload "$TAG" build/tv-client/* --clobber
