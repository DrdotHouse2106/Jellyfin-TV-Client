# Jellyfin-TV-Client: baut die App bei jedem Push auf main und bei jedem Tag v*.
# Bei einem Tag (z. B. v1.0.0) wird zusätzlich ein GitHub-Release mit der APK angelegt.
# Für eine signierte App müssen die Secrets KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS und
# KEY_PASSWORD gesetzt sein (siehe README). Ohne sie entsteht nur eine Debug-APK.
name: TV-Client / Build

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release mit der Version aus tv-client-version.txt anlegen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: Set JELLYFIN_VERSION
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "JELLYFIN_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "JELLYFIN_VERSION=$(tr -d '[:space:]' < tv-client-version.txt)" >> $GITHUB_ENV
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Keine Signatur-Secrets gesetzt – es wird nur eine Debug-APK gebaut (siehe README)."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Assemble release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Assemble debug APK
        if: steps.keystore.outputs.signed != 'true'
        run: ./gradlew :app:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p build/tv-client
          find app/build/outputs/apk -iname "*.apk" -exec cp "{}" build/tv-client/ \;
          find app/build/outputs/bundle -iname "*.aab" -exec cp "{}" build/tv-client/ \; 2>/dev/null || true
          # Fester Dateiname für einen gleichbleibenden Download-Link:
          # https://github.com/DrdotHouse2106/Jellyfin-TV-Client/releases/latest/download/quallenkino.apk
          for f in build/tv-client/*-release.apk; do [ -e "$f" ] && cp "$f" build/tv-client/quallenkino.apk; done

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: jellyfin-tv-client-${{ env.JELLYFIN_VERSION }}
          retention-days: 30
          if-no-files-found: error
          path: build/tv-client/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$JELLYFIN_VERSION"
          gh release create "$TAG" build/tv-client/* --target "$GITHUB_SHA" --title "Quallenkino $TAG" --notes "Fire TV / Android TV: quallenkino.apk. Änderungen siehe CHANGELOG-TV.md." \
            || gh release upload "$TAG" build/tv-client/* --clobber
