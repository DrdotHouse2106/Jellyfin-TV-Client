# Quallenkino für webOS (LG-Fernseher): Probe-Build der .ipk bei Änderungen in webos/.
# Veröffentlicht wird die .ipk zusammen mit der Android-App im Release vX.Y.Z
# (Workflow „TV-Client / Build“, Version aus tv-client-version.txt).
name: webOS / Build

on:
  push:
    branches:
      - main
    paths:
      - 'webos/**'
      - '.github/workflows/webos-build.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Install ares-cli
        run: npm install -g @webosose/ares-cli

      - name: Check packaging
        run: ares-package --check services frontend

      - name: Build package
        run: |
          mkdir -p build
          ares-package --no-minify --outdir build/ services frontend
          node tools/gen-manifest.js build/de.drdothouse.quallenkino.manifest.json
          VERSION=$(node -p "require('./frontend/appinfo.json').version")
          cp build/de.drdothouse.quallenkino_${VERSION}_all.ipk build/quallenkino-webos.ipk
          ls -la build

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: quallenkino-webos
          if-no-files-found: error
          path: webos/build/
